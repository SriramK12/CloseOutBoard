<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Close-out Board</title>
<meta name="description" content="Close-out Board demo: one-line closing-time deals from farmers market vendors to nearby shoppers.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23166534'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>C</text></svg>">
<style>
  :root {
    --accent: #166534;
    --accent-dark: #14532d;
    --accent-soft: #dcfce7;
    --deal: #c2410c;
    --deal-soft: #ffedd5;
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #6b6560;
    --border: #e7e5e0;
    --danger: #b91c1c;
    --danger-soft: #fef2f2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
  }
  header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .bar {
    max-width: 960px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
  }
  .logo { font-weight: 800; font-size: 20px; color: var(--accent); margin-right: auto; }
  .logo span { color: var(--deal); }
  .role-toggle { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; }
  .role-toggle button {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 999px;
    font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .role-toggle button.active { background: var(--accent); color: #fff; }
  .clockbar {
    max-width: 960px; margin: 0 auto; padding: 0 16px 10px;
    display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted);
  }
  .clock { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; font-size: 16px; }
  .clockbar .sep { flex: 1; }
  .mini {
    border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-size: 13px;
    font-weight: 600; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .mini.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .pill.open { background: var(--accent-soft); color: var(--accent-dark); }
  .pill.wait { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .pill.closed { background: var(--danger-soft); color: var(--danger); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .cols { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .field { margin-bottom: 14px; }
  .req { color: var(--danger); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .btn {
    border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: 10px 18px; border-radius: 8px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn.big { width: 100%; padding: 14px; font-size: 17px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.ghost:hover { background: var(--accent-soft); }
  .btn.sold { background: var(--deal); }
  .btn.sold:hover { background: #9a3412; }
  .btn.sm { padding: 6px 12px; font-size: 14px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .preview {
    border: 2px dashed var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 15px; min-height: 50px;
  }
  .preview small { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .line b { font-weight: 700; }
  .line .d { color: var(--deal); font-weight: 700; }
  .line .t { color: var(--muted); }
  .deals { list-style: none; padding: 0; margin: 0; }
  .deal {
    background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--deal);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
  }
  .deal .what { font-size: 17px; }
  .deal .what b { font-weight: 700; }
  .deal .price { color: var(--deal); font-weight: 700; }
  .deal .who { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .deal .left { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .deal .left strong { display: block; font-size: 20px; line-height: 1.1; }
  .deal .left span { font-size: 12px; color: var(--muted); }
  .deal.soon { border-left-color: var(--danger); }
  .deal.soon .left strong { color: var(--danger); }
  .deal.out { border-left-color: var(--border); opacity: .6; }
  .deal.out .what { text-decoration: line-through; }
  .deal.out .left strong { font-size: 14px; color: var(--muted); }
  .deal.new { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--deal-soft); } to { background: var(--card); } }
  .empty { text-align: center; color: var(--muted); padding: 32px 16px; }
  .note { font-size: 13px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat strong { display: block; font-size: 26px; line-height: 1.1; }
  .stat span { font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  .mock { display: inline-block; background: var(--deal-soft); color: var(--deal); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600;
    opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .timer { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Close-out <span>Board</span></div>
    <div class="role-toggle" role="tablist">
      <button data-role="vendor">Vendor</button>
      <button data-role="shopper">Shopper</button>
      <button data-role="market">Market</button>
    </div>
  </div>
  <div class="clockbar">
    <span>Riverside Saturday Market</span>
    <span class="clock" id="clock"></span>
    <span id="status"></span>
    <span class="sep"></span>
    <button class="mini" id="play">▶ Play</button>
    <button class="mini" id="skip">+10 min</button>
    <button class="mini" id="reset">Reset</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
// ---------- Market config (minutes since midnight) ----------
const MARKET = { name: "Riverside Saturday Market", opens: 8 * 60, closes: 13 * 60, windowStart: 11 * 60 + 30 };
const START_TIME = 11 * 60 + 50;

const VENDORS = [
  { id: "green", name: "Green Acre Farm", stall: "Stall B4", kind: "Produce" },
  { id: "rise", name: "Rise & Crumb Bakery", stall: "Stall A1", kind: "Bakery" },
  { id: "salsa", name: "Rio Salsa Co.", stall: "Stall C2", kind: "Prepared food" },
  { id: "orchard", name: "Hillside Orchard", stall: "Stall B7", kind: "Produce" },
  { id: "dairy", name: "Two Cows Creamery", stall: "Stall A5", kind: "Dairy" },
  { id: "flower", name: "Petal & Stem", stall: "Stall C6", kind: "Flowers" }
];

function seed() {
  return {
    now: START_TIME,
    nextId: 4,
    deals: [
      { id: 1, vendor: "rise", item: "Sourdough loaves", deal: "$4 each (was $8)", posted: 11 * 60 + 35, ends: 12 * 60 + 30, soldOut: false },
      { id: 2, vendor: "orchard", item: "Peaches", deal: "Half flat for $8", posted: 11 * 60 + 40, ends: 13 * 60, soldOut: false },
      { id: 3, vendor: "salsa", item: "Salsa verde, 16 oz", deal: "2 for $10", posted: 11 * 60 + 45, ends: 12 * 60 + 5, soldOut: false }
    ]
  };
}

let DATA = seed();
const state = { role: "vendor", vendor: "green", draft: { item: "", deal: "", ends: null }, flashId: null };
let playTimer = null;

// ---------- Helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const vendorById = (id) => VENDORS.find((v) => v.id === id);
function fmt(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return `${((h + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
const isExpired = (d) => DATA.now >= d.ends;
const isLive = (d) => !d.soldOut && !isExpired(d);
const windowOpen = () => DATA.now >= MARKET.windowStart && DATA.now < MARKET.closes;
const marketClosed = () => DATA.now >= MARKET.closes;

function lineHTML(item, deal, ends, vendor) {
  const v = vendorById(vendor);
  return `<span class="line"><b>${esc(item || "Item")}</b> · <span class="d">${esc(deal || "deal")}</span> <span class="t">· until ${fmt(ends)} · ${esc(v.name)}, ${esc(v.stall)}</span></span>`;
}

// End-time choices: every 5 min from now+5 up to market close.
function endChoices() {
  const out = [];
  const first = Math.ceil((DATA.now + 5) / 5) * 5;
  for (let m = first; m <= MARKET.closes; m += 5) out.push(m);
  return out;
}

// ---------- Clock ----------
function tick(mins) {
  const before = DATA.deals.filter(isLive).length;
  DATA.now = Math.min(DATA.now + mins, MARKET.closes);
  const expired = before - DATA.deals.filter(isLive).length;
  if (expired > 0) toast(`${expired} deal${expired > 1 ? "s" : ""} expired automatically`);
  if (marketClosed()) stopPlay();
  render();
}
function stopPlay() {
  clearInterval(playTimer);
  playTimer = null;
  $("#play").textContent = "▶ Play";
  $("#play").classList.remove("on");
}
$("#play").onclick = () => {
  if (playTimer) return stopPlay();
  if (marketClosed()) return toast("Market is closed. Reset to run it again.");
  playTimer = setInterval(() => tick(1), 1000);
  $("#play").textContent = "❚❚ 1 min/sec";
  $("#play").classList.add("on");
};
$("#skip").onclick = () => tick(10);
$("#reset").onclick = () => {
  stopPlay();
  DATA = seed();
  state.draft = { item: "", deal: "", ends: null };
  render();
  toast("Demo reset to 11:50 AM");
};

// ---------- Views ----------
function renderHeader() {
  document.querySelectorAll(".role-toggle button").forEach((b) => b.classList.toggle("active", b.dataset.role === state.role));
  $("#clock").textContent = fmt(DATA.now);
  const left = MARKET.closes - DATA.now;
  $("#status").innerHTML = marketClosed()
    ? `<span class="pill closed">Market closed</span>`
    : windowOpen()
      ? `<span class="pill open">Closing window · ${left} min to close</span>`
      : `<span class="pill wait">Board opens ${fmt(MARKET.windowStart)}</span>`;
}

function renderVendor() {
  const v = vendorById(state.vendor);
  const mine = DATA.deals.filter((d) => d.vendor === v.id).sort((a, b) => b.posted - a.posted);
  const choices = endChoices();
  if (state.draft.ends === null || !choices.includes(state.draft.ends)) state.draft.ends = choices[choices.length - 1] ?? MARKET.closes;
  const canPost = windowOpen();
  const d = state.draft;
  const ready = d.item.trim() && d.deal.trim() && canPost;

  return `
    <h1>Post a closing deal</h1>
    <p class="lead">One line: item, deal, and how long it lasts. You decide whether, what and how much.</p>
    <div class="cols">
      <div class="card">
        <div class="field">
          <label for="who">Posting as</label>
          <select id="who">${VENDORS.map((x) => `<option value="${x.id}" ${x.id === v.id ? "selected" : ""}>${esc(x.name)} (${esc(x.stall)})</option>`).join("")}</select>
        </div>
        <div class="field">
          <label for="item">Item <span class="req">*</span></label>
          <input id="item" maxlength="40" placeholder="Heirloom tomatoes" value="${esc(d.item)}" autocomplete="off">
          <div class="quick">${quickChips(v).map((q) => `<button class="mini" data-fill="item" data-val="${esc(q)}">${esc(q)}</button>`).join("")}</div>
        </div>
        <div class="field">
          <label for="deal">Deal <span class="req">*</span></label>
          <input id="deal" maxlength="40" placeholder="2 lb for $5" value="${esc(d.deal)}" autocomplete="off">
          <div class="quick">${["2 for $5", "Half off", "$3 a pint", "Buy 1 get 1"].map((q) => `<button class="mini" data-fill="deal" data-val="${esc(q)}">${esc(q)}</button>`).join("")}</div>
        </div>
        <div class="field">
          <label for="ends">Ends at <span class="req">*</span></label>
          <select id="ends" ${choices.length ? "" : "disabled"}>${choices.map((m) => `<option value="${m}" ${m === d.ends ? "selected" : ""}>${fmt(m)}${m === MARKET.closes ? " (market close)" : ""}</option>`).join("")}</select>
          <div class="hint">The deal disappears from the board automatically at this time.</div>
        </div>
        <div class="preview"><small>Shoppers will see</small><span id="preview">${lineHTML(d.item, d.deal, d.ends, v.id)}</span></div>
        <button class="btn big" id="post" ${ready ? "" : "disabled"}>Post to board</button>
        <div class="timer" id="timer">${canPost ? "No photos, no pickup window, no payout setup." : marketClosed() ? "Market is closed for today." : `Posting opens at ${fmt(MARKET.windowStart)}, the start of the closing window.`}</div>
      </div>
      <div>
        <div class="card">
          <h2>Your posts today</h2>
          ${mine.length ? `<ul class="deals">${mine.map(vendorDealRow).join("")}</ul>` : `<div class="empty">Nothing posted yet. Posting is optional, so only post when you want to move something.</div>`}
        </div>
        <p class="note">Shoppers pay you at the stall as usual. No money moves through Close-out Board.</p>
      </div>
    </div>`;
}

function quickChips(v) {
  return {
    Produce: ["Heirloom tomatoes", "Strawberries", "Mixed greens"],
    Bakery: ["Baguettes", "Croissants", "Cinnamon rolls"],
    "Prepared food": ["Tamales", "Salsa roja, 16 oz"],
    Dairy: ["Fresh mozzarella", "Greek yogurt, quart"],
    Flowers: ["Zinnia bunches", "Sunflowers"]
  }[v.kind] || [];
}

function vendorDealRow(d) {
  const status = d.soldOut ? "Sold out" : isExpired(d) ? "Expired" : `Live · ${d.ends - DATA.now} min left`;
  return `<li class="deal ${isLive(d) ? "" : "out"}">
    <div><div class="what"><b>${esc(d.item)}</b> · <span class="price">${esc(d.deal)}</span></div>
    <div class="who">${status} · posted ${fmt(d.posted)}</div></div>
    ${isLive(d) ? `<button class="btn sold sm" data-sold="${d.id}">Sold out</button>` : ""}
  </li>`;
}

function renderShopper() {
  const live = DATA.deals.filter(isLive).sort((a, b) => a.ends - b.ends);
  const sold = DATA.deals.filter((d) => d.soldOut && !isExpired(d));
  const expired = DATA.deals.filter((d) => isExpired(d) && !d.soldOut).length;
  let body;
  if (!windowOpen() && !marketClosed()) {
    body = `<div class="card empty">The board opens at ${fmt(MARKET.windowStart)}, the last 90 minutes before close.</div>`;
  } else if (!live.length && !sold.length) {
    body = `<div class="card empty">${marketClosed() ? "The market is closed. See you next Saturday." : "No closing deals right now. Vendors post as they pack up, so check back."}</div>`;
  } else {
    body = `<ul class="deals">${live.map(shopperDealRow).join("")}${sold.map(shopperDealRow).join("")}</ul>`;
  }
  return `
    <h1>Closing deals</h1>
    <p class="lead">${esc(MARKET.name)} · ${live.length} live deal${live.length === 1 ? "" : "s"}, ending soonest first. No account needed. Pay at the stall.</p>
    ${body}
    ${expired ? `<p class="note">${expired} earlier deal${expired > 1 ? "s have" : " has"} ended.</p>` : ""}`;
}

function shopperDealRow(d) {
  const v = vendorById(d.vendor);
  const left = d.ends - DATA.now;
  const cls = d.soldOut ? "out" : left <= 10 ? "soon" : "";
  return `<li class="deal ${cls} ${state.flashId === d.id ? "new" : ""}">
    <div><div class="what"><b>${esc(d.item)}</b> · <span class="price">${esc(d.deal)}</span></div>
    <div class="who">${esc(v.name)} · ${esc(v.stall)}</div></div>
    <div class="left">${d.soldOut ? `<strong>Sold out</strong>` : `<strong>${left} min</strong><span>until ${fmt(d.ends)}</span>`}</div>
  </li>`;
}

function renderMarket() {
  const rows = VENDORS.map((v) => {
    const ds = DATA.deals.filter((d) => d.vendor === v.id);
    return { v, posts: ds.length, live: ds.filter(isLive).length, sold: ds.filter((d) => d.soldOut).length,
      first: ds.length ? Math.min(...ds.map((d) => d.posted)) : null };
  });
  const posting = rows.filter((r) => r.posts).length;
  const total = DATA.deals.length;
  const live = DATA.deals.filter(isLive).length;
  const sold = DATA.deals.filter((d) => d.soldOut).length;
  return `
    <h1>Market view <span class="mock">MOCKED</span></h1>
    <p class="lead">Is the board being used? Posts by vendor for today's closing window.</p>
    <div class="stats">
      <div class="stat"><strong>${posting} / ${VENDORS.length}</strong><span>vendors posted</span></div>
      <div class="stat"><strong>${total}</strong><span>deals posted</span></div>
      <div class="stat"><strong>${live}</strong><span>live now</span></div>
      <div class="stat"><strong>${sold}</strong><span>marked sold out</span></div>
    </div>
    <div class="card tablewrap">
      <table>
        <thead><tr><th>Vendor</th><th>Stall</th><th class="num">Posts</th><th class="num">Live</th><th class="num">Sold out</th><th>First post</th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td>${esc(r.v.name)}</td><td>${esc(r.v.stall)}</td><td class="num">${r.posts}</td><td class="num">${r.live}</td><td class="num">${r.sold}</td><td>${r.first === null ? `<span class="note">—</span>` : fmt(r.first)}</td></tr>`).join("")}</tbody>
      </table>
    </div>
    <p class="note">Pilot metrics to collect alongside this: shoppers who mention the board at the stall, and whether each vendor would pay $3 to $5 a market day to keep using it.</p>`;
}

function render() {
  renderHeader();
  const app = $("#app");
  app.innerHTML = state.role === "vendor" ? renderVendor() : state.role === "shopper" ? renderShopper() : renderMarket();
  if (state.role === "vendor") bindVendor();
  state.flashId = null;
}

// ---------- Vendor interactions ----------
function bindVendor() {
  const upd = () => {
    $("#preview").innerHTML = lineHTML(state.draft.item, state.draft.deal, state.draft.ends, state.vendor);
    $("#post").disabled = !(state.draft.item.trim() && state.draft.deal.trim() && windowOpen());
  };
  $("#who").onchange = (e) => { state.vendor = e.target.value; render(); };
  $("#item").oninput = (e) => { state.draft.item = e.target.value; upd(); };
  $("#deal").oninput = (e) => { state.draft.deal = e.target.value; upd(); };
  $("#ends").onchange = (e) => { state.draft.ends = Number(e.target.value); upd(); };
  document.querySelectorAll("[data-fill]").forEach((b) => b.onclick = () => {
    state.draft[b.dataset.fill] = b.dataset.val;
    $("#" + b.dataset.fill).value = b.dataset.val;
    upd();
  });
  $("#post").onclick = () => {
    const d = state.draft;
    const deal = { id: DATA.nextId++, vendor: state.vendor, item: d.item.trim(), deal: d.deal.trim(), posted: DATA.now, ends: d.ends, soldOut: false };
    DATA.deals.push(deal);
    state.flashId = deal.id;
    state.draft = { item: "", deal: "", ends: null };
    render();
    toast(`Posted · live until ${fmt(deal.ends)}`);
  };
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-sold]");
  if (!b) return;
  const d = DATA.deals.find((x) => x.id === Number(b.dataset.sold));
  d.soldOut = true;
  render();
  toast(`${d.item} marked sold out`);
});

document.querySelectorAll(".role-toggle button").forEach((b) => b.onclick = () => {
  state.role = b.dataset.role;
  render();
  window.scrollTo(0, 0);
});

render();
</script>
</body>
</html>
